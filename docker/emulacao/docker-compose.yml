# Catálogo de ROMs (RomM) e banco próprio, em rede bridge dedicada — mesmo
# padrão do arr-stack: os dois containers se enxergam pelo nome (romm ->
# romm-db) sem depender do host.
#
# Porta do host escolhida para não colidir com as já usadas pelas outras
# stacks (ver docs/00-arquitetura.md): 8090 está livre.

services:
  romm:
    # Versão fixada: o RomM já introduziu mudanças incompatíveis no
    # config.yml entre versões menores (a 5.3.0 passou a exigir
    # filesystem.structure). Atualizar deliberadamente, após ler as notas
    # da release, junto com a imagem do romm-webstation (o broker de
    # streaming acompanha o protocolo de cada versão do RomM).
    image: rommapp/romm:5.4.1
    container_name: romm
    restart: unless-stopped
    # Teto de memória: se o gunicorn demora a gravar o pid, o watchdog do
    # init sobe novos processos em cascata sem encerrar os anteriores
    # (rommapp/romm#5246); sem limite, isso consome a RAM e o swap do host.
    # Uso normal na 5.4 fica em torno de 1 GB (quatro workers do gunicorn
    # e as filas do RQ).
    mem_limit: 3g
    environment:
      DB_HOST: romm-db
      DB_NAME: romm
      DB_USER: romm-user
      DB_PASSWD: ${ROMM_DB_PASSWORD:?defina ROMM_DB_PASSWORD no .env da raiz}
      ROMM_AUTH_SECRET_KEY: "${ROMM_AUTH_SECRET_KEY:?defina ROMM_AUTH_SECRET_KEY no .env da raiz, gerada com openssl rand -hex 32}"
      # Fontes de metadados. Hasheous identifica por hash do arquivo e não
      # exige conta; as demais são opcionais e ficam em branco até o operador
      # criar conta em cada serviço — ver docs/01-instalacao.md.
      IGDB_CLIENT_ID: ${ROMM_IGDB_CLIENT_ID:-}
      IGDB_CLIENT_SECRET: ${ROMM_IGDB_CLIENT_SECRET:-}
      SCREENSCRAPER_USER: ${ROMM_SCREENSCRAPER_USER:-}
      SCREENSCRAPER_PASSWORD: ${ROMM_SCREENSCRAPER_PASSWORD:-}
      RETROACHIEVEMENTS_API_KEY: ${ROMM_RETROACHIEVEMENTS_API_KEY:-}
      STEAMGRIDDB_API_KEY: ${ROMM_STEAMGRIDDB_API_KEY:-}
      HASHEOUS_API_ENABLED: "true"
      SCAN_WORKERS: 4
      WEB_SERVER_CONCURRENCY: 4
      # Segredo compartilhado com o broker do romm-webstation (streaming).
      STREAMING_BROKER_SECRET: ${ROMM_STREAMING_BROKER_SECRET:?defina ROMM_STREAMING_BROKER_SECRET no .env da raiz, gerada com openssl rand -hex 32}
    volumes:
      # Estado gerado pelo RomM fica em APPDATA_ROOT (disco de sistema). O
      # config.yml fica em ./romm/config, fora do git: o próprio RomM o
      # regrava (como root) ao salvar ajustes pela interface.
      - ${APPDATA_ROOT:?defina APPDATA_ROOT no .env da raiz}/emulacao/romm/resources:/romm/resources   # capas, screenshots etc. buscados nos provedores de metadados
      - ${APPDATA_ROOT:?defina APPDATA_ROOT no .env da raiz}/emulacao/romm/redis-data:/redis-data      # fila de tarefas em segundo plano (scan da biblioteca)
      - ${APPDATA_ROOT:?defina APPDATA_ROOT no .env da raiz}/emulacao/romm/assets:/romm/assets         # save states e saves enviados pela interface
      - ./romm/config:/romm/config         # config.yml (mapeamento manual de plataformas, se precisar)
      # Biblioteca de ROMs. Estrutura esperada dentro da pasta: roms/<slug-da-
      # -plataforma>/arquivo (ex.: roms/snes, roms/gba) — ver docs/01-instalacao.md.
      - ${ROMS_ROOT:?defina ROMS_ROOT no .env da raiz}:/romm/library
    ports:
      - "8090:8080"
    depends_on:
      romm-db:
        condition: service_healthy
        restart: true

  romm-db:
    # Versão fixada, para que um pull da stack não troque o banco de versão
    # junto com o RomM.
    image: mariadb:13.0.2
    container_name: romm-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${ROMM_DB_ROOT_PASSWORD:?defina ROMM_DB_ROOT_PASSWORD no .env da raiz}
      MARIADB_DATABASE: romm
      MARIADB_USER: romm-user
      MARIADB_PASSWORD: ${ROMM_DB_PASSWORD:?defina ROMM_DB_PASSWORD no .env da raiz}
    volumes:
      - ${APPDATA_ROOT:?defina APPDATA_ROOT no .env da raiz}/emulacao/romm-db/data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 30s
      start_interval: 10s
      interval: 10s
      timeout: 5s
      retries: 5

  # Streaming de emulador: PCSX2, Flycast, Azahar etc. rodam aqui, no
  # servidor, e o navegador recebe só o vídeo (Selkies). Cobre o que o
  # EmulatorJS do navegador não emula (PS2, Dreamcast, 3DS). O RomM manda
  # os comandos de jogo ao romm-broker embutido, pela rede da stack.
  romm-webstation:
    # Variante para o RomM (webstation + romm-broker), amd64 apenas. A tag
    # "romm" acompanha cada versão nova do broker; a versão fica fixada
    # para ser trocada junto com a do RomM.
    image: lscr.io/linuxserver/webstation:romm-v0.15.1-ls40
    container_name: romm-webstation
    # Sob demanda: ligado pelo card "Streaming de jogos" do painel e desligado
    # após 30 min sem jogo (streaming-ocioso.timer). O verifica-containers
    # ignora containers com esta label quando estão parados. unless-stopped
    # mantém parado, após um reboot, o que foi desligado.
    restart: unless-stopped
    labels:
      homelab.sob-demanda: "true"
    environment:
      PUID: ${PUID:?defina PUID no .env da raiz}
      PGID: ${PGID:?defina PGID no .env da raiz}
      TZ: ${TZ:?defina TZ no .env da raiz}
      SUBFOLDER: /streaming/
      BROKER_SECRET: ${ROMM_STREAMING_BROKER_SECRET:?defina ROMM_STREAMING_BROKER_SECRET no .env da raiz}
      # GPU integrada Intel, escolhida pelo endereço PCI. O script de
      # webstation/custom-cont-init.d converte GPU_PCI no nome renderD* que a
      # GPU recebeu neste boot e o exporta como DRINODE (renderização) e
      # DRI_NODE (codificação VA-API); o Selkies só aceita esse formato de
      # nome, e a numeração muda com a ordem de carga dos drivers. AUTO_GPU
      # desligado impede a escolha automática, que pegaria o primeiro nodo.
      # A NVIDIA exigiria o nvidia-container-toolkit no host.
      GPU_PCI: ${GPU_PCI:?defina GPU_PCI no .env da raiz}
      AUTO_GPU: "false"
    devices:
      - /dev/dri:/dev/dri
    volumes:
      # Configuração dos emuladores, BIOS e saves do lado do container.
      - ${APPDATA_ROOT:?defina APPDATA_ROOT no .env da raiz}/emulacao/webstation:/config
      # Mesma biblioteca e mesmo caminho do RomM (o broker recusa ROMs fora
      # de /romm e o library_path padrão do config.yml é /romm/library).
      - ${ROMS_ROOT:?defina ROMS_ROOT no .env da raiz}:/romm/library:ro
      # Nomes estáveis dos nodos de GPU e o script que escolhe entre eles.
      - /dev/dri/by-path:/dev/dri/by-path:ro
      - ./webstation/custom-cont-init.d:/custom-cont-init.d:ro
    ports:
      # Só localhost: a interface não tem login próprio. O acesso pelo
      # navegador passa pelo tailscale serve (HTTPS, obrigatório para o
      # Selkies), restrito à tailnet — ver docs/01-instalacao.md.
      - "127.0.0.1:3010:3000"
    shm_size: "1gb"
